<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f8f2">
    <title>Wortwunder – Rechtschreibtrainer</title>
    <style>:root {
  color: #17382f;
  background: #f4f8f2;
  font-family: Inter, ui-rounded, "Trebuchet MS", system-ui, sans-serif;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  --green: #19745c;
  --green-dark: #155542;
  --mint: #dcefe5;
  --ink: #17382f;
  --muted: #657a71;
  --line: #dce7de;
  --paper: #fff;
  --orange: #fae8c9;
}

* { box-sizing: border-box; }
body { margin: 0; min-width: 320px; }
button, input, select { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #efb34f; outline-offset: 2px; }
.shell { max-width: 940px; padding: 24px 20px 48px; margin: 0 auto; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 26px; }
.brand { display: flex; align-items: center; gap: 11px; color: var(--ink); font-size: 1.18rem; font-weight: 850; letter-spacing: -.04em; }
.brand-mark { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 14px; background: var(--green); color: white; font-size: 1.25rem; }
.stats { display: flex; gap: 10px; }
.stat { border-radius: 14px; background: var(--paper); padding: 9px 14px; text-align: center; min-width: 74px; box-shadow: 0 2px 10px #1a4d3510; }
.stat strong { display: block; font-size: 1.05rem; }
.stat span { color: var(--muted); font-size: .73rem; }
.hero { padding: 28px; margin-bottom: 22px; border-radius: 23px; color: white; background: linear-gradient(120deg, #17684f, #258568); }
.hero h1 { margin: 0 0 7px; font-size: clamp(1.55rem, 5vw, 2.2rem); letter-spacing: -.04em; }
.hero p { max-width: 590px; margin: 0; line-height: 1.55; color: #e1f3e9; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 26px 0 13px; }
.section-head h2 { margin: 0; font-size: 1.15rem; letter-spacing: -.02em; }
.section-head label { color: var(--muted); font-size: .86rem; }
.mode-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
.mode-card { display: flex; min-height: 117px; width: 100%; padding: 17px; align-items: flex-start; text-align: left; gap: 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; color: var(--ink); transition: transform .15s, border-color .15s; }
.mode-card:hover { transform: translateY(-2px); border-color: #8dbca5; }
.mode-icon { display: grid; place-items: center; width: 43px; height: 43px; flex: 0 0 43px; border-radius: 14px; background: var(--mint); font-size: 1.35rem; }
.mode-card strong { display: block; margin: 3px 0 6px; font-size: 1rem; }
.mode-card small { display: block; color: var(--muted); line-height: 1.45; font-size: .81rem; }
.progress-card, .exercise-card { padding: 22px; border: 1px solid var(--line); border-radius: 20px; background: var(--paper); box-shadow: 0 4px 18px #1a4d3508; }
.progress-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 20px; }
.progress-row { font-size: .82rem; }
.progress-label { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.progress-label span:last-child { color: var(--muted); }
.bar { height: 7px; overflow: hidden; border-radius: 9px; background: #edf2ed; }
.bar > span { display: block; height: 100%; border-radius: inherit; background: #44a17e; }
.practice-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.back-button, .secondary-button { border: 0; background: transparent; color: var(--green); font-weight: 700; padding: 8px 0; }
.exercise-title { margin: 0; font-size: 1.25rem; }
.exercise-meta { color: var(--muted); font-size: .84rem; }
.prompt { padding: 19px; margin: 16px 0; border-radius: 15px; background: #f3f8f3; font-size: 1.28rem; line-height: 1.6; text-align: center; }
.prompt-label { color: var(--muted); font-size: .83rem; text-align: center; margin: 4px 0 10px; }
.input-row { display: flex; gap: 10px; }
.answer-input { width: 100%; min-width: 0; padding: 13px 14px; border: 1px solid #cbd9ce; border-radius: 12px; background: white; color: var(--ink); }
.primary-button { border: 0; border-radius: 12px; padding: 12px 19px; color: white; background: var(--green); font-weight: 750; white-space: nowrap; }
.primary-button:hover { background: var(--green-dark); }
.secondary-button { border: 1px solid var(--line); border-radius: 11px; padding: 10px 14px; color: var(--ink); }
.actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 14px 0 0; }
.options { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
.option-button, .word-chip { border: 1px solid #cbd9ce; border-radius: 12px; padding: 11px 18px; background: white; color: var(--ink); }
.option-button.selected, .word-chip.selected { border-color: var(--green); background: var(--mint); box-shadow: inset 0 0 0 1px var(--green); }
.word-chip { padding: 5px 7px; margin: 1px; font-size: inherit; }
.sentence { line-height: 2.3; text-align: center; }
.feedback { margin-top: 17px; padding: 14px 16px; border-radius: 13px; line-height: 1.5; }
.feedback.correct { background: #e0f3e6; color: #1c6546; }
.feedback.incorrect { background: #fff0dd; color: #784e18; }
.feedback strong { display: block; }
.feedback p { margin: 5px 0 0; }
.next-row { display: flex; justify-content: flex-end; margin-top: 13px; }
.category-select { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: white; color: var(--ink); }
.session-summary { text-align: center; padding: 28px 18px; }
.session-summary .score { font-size: 2.7rem; font-weight: 850; color: var(--green); }
.session-summary h2 { margin: 4px 0; }
.empty { text-align: center; color: var(--muted); padding: 16px; }
.hidden { display: none !important; }
@media (max-width: 600px) {
  .shell { padding: 16px 14px 36px; }
  .topbar { margin-bottom: 18px; }
  .stat { min-width: 60px; padding: 7px 9px; }
  .hero { padding: 22px 19px; border-radius: 19px; }
  .mode-grid, .progress-list { grid-template-columns: 1fr; }
  .mode-card { min-height: 94px; }
  .section-head { align-items: flex-start; }
  .input-row { flex-direction: column; }
  .primary-button { min-height: 46px; }
}
</style>
